# #Configuration File’s Structure:
# #
# #nginx consists of modules which are controlled by directives specified
# # in the configuration file. Directives are divided into simple directives
# # and block directives. A simple directive consists of the name and
# # parameters separated by spaces and ends with a semicolon (;).
# #
# #A block directive has the same structure as a simple directive,
# # but instead of the semicolon it ends with a set of additional
# # instructions surrounded by braces ({ and }).
# #
# #If a block directive can have other directives inside braces,
# # it is called a context (examples: events, http, server, and location).
# #
# #Directives placed in the configuration file outside of any contexts are
# # considered to be in the main context. The events and http directives
# # reside in the main context, server in http, and location in server.
# #
# #The rest of a line after the # sign is considered a comment.




# # #from https://cybermatch.tech/6-steps-to-a-successful-nginx-docker-image-setup/
# # server
# # {
# # #	Prevents connection though port 80 (http)
# # 	listen 80;
# # 	return 444;# closes a connection without sending a response header
# # }

# # server {
# #     listen 443;

# #     location / {
# #       root /usr/share/nginx/html;
# #       test test.html;
# #     }

# # 	location /api/ {
# # 	    proxy_pass https://myapi.com;
# # 	    proxy_set_header Host $host;
# # 	}
# # }

# #--------------------------------------------------------------------#

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    access_log    off;
    error_log     /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen       5173;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        error_page 404 /index.html;
    }
}
