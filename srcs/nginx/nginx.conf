# events {} http { server { listen 80; return 200 "Nginx is alive"; } }
events {
	worker_connections 1024;
}

http {
    client_max_body_size 600M;
    server {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $django http://django_backend:8000;
        # Ascolta internamente sulla porta 80
        listen 80;

        # REGOLA 1: Se l'URL inizia con /api/, manda la richiesta a Django
        location /api/ {
            # NOTA: Usiamo esattamente il nome "django_backend" che hai messo nel compose!
            proxy_pass $django;
            # $http_host (con la porta) cosi' Django costruisce URL tipo http://<IP>:8080/...
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # REGOLA 1b: foto e video (MinIO). Il browser li chiede a /media/... sullo stesso
        # indirizzo del sito, quindi non serve mai scrivere l'IP del server da nessuna parte.
        location /media/ {
            resolver 127.0.0.11 valid=10s;          # DNS interno di docker (risolve a ogni richiesta)
            set $minio_upstream http://ready2roll-storage:9000;
            proxy_pass $minio_upstream;             # l'URL /media/... passa invariato (bucket "media")
            proxy_set_header Host ready2roll-storage:9000;
            proxy_buffering off;                    # video in streaming
        }

        location /ws/ {
            proxy_pass $django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # REGOLA 2: Qualsiasi altra cosa, mandala a Vue.js
        location / {
            # NOTA: Usiamo esattamente "vuejs-prod".
            # (Se il tuo Nginx del frontend ascolta sulla 5173 lascia così, se ascolta sulla 80 metti 80)
            proxy_pass http://vuejs-prod:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
		}
	}
}
