events {
    worker_connections 1024;
}

http {
    server {
        # Ascolta internamente sulla porta 80
        listen 80;

        # REGOLA 1: Se l'URL inizia con /api/, manda la richiesta a Django
        location /api/ {
            # NOTA: Usiamo esattamente il nome "django_backend" che hai messo nel compose!
            proxy_pass http://django_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # REGOLA 2: Qualsiasi altra cosa, mandala a Vue.js
        location / {
            # NOTA: Usiamo esattamente "vuejs-prod".
            # (Se il tuo Nginx del frontend ascolta sulla 5173 lascia così, se ascolta sulla 80 metti 80)
            proxy_pass http://vuejs-prod:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Necessario se usate i WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
