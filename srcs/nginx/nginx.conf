# events {} http { server { listen 80; return 200 "Nginx is alive"; } }
events {
	worker_connections 1024;
}

http {
    client_max_body_size 600M;
    server {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $django http://django:8000;
        # Listen internally on port 80
        listen 80;

        # RULE 1: If the URL starts with /api/, sends the request to Django
        location /api/ {
            # NOTE: $django points to "django"
            proxy_pass $django;
            # $http_host (including the port) so Django builds URLs like http://<IP>:8080/...
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # RULE 1b: photos and videos (MinIO). The browser requests them at /media/... on the same
        # address as the site, so the server's IP never needs to be hardcoded anywhere.
        location /media/ {
            resolver 127.0.0.11 valid=10s;          # Docker's internal DNS (re-resolves on every request)
            set $minio_upstream http://ready2roll-storage:9000;
            proxy_pass $minio_upstream;             # the /media/... URL is passed through unchanged (bucket "media")
            proxy_set_header Host ready2roll-storage:9000;
            proxy_buffering off;                    # video streaming
        }

        location /ws/ {
            proxy_pass $django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # RULE 2: Anything else goes to Vue.js
        location / {
            # NOTE: "vuejs" must match the service name in docker-compose.
            # (If your frontend Nginx listens on 5173, leave this as is; if it listens on 80, change it to 80)
            proxy_pass http://vuejs:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "Upgrade";
		}
	}
}
