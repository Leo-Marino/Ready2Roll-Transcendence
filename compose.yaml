#=============================================================================
#Ready2Roll — docker-compose.yml
#Stack: Vue.js + Django + PostgreSQL + Nginx + MinIO + Redis
#=============================================================================

name: ready2roll

services:

#---------------------------------------------------------------------------
#Vue.js — frontend
#---------------------------------------------------------------------------
  vuejs-prod:
    build:
      context: ./srcs
      dockerfile: frontend/Dockerfile
      target: builder
    container_name: vuejs_container
    image: vue_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - frontend-net

#---------------------------------------------------------------------------
#Reverse proxy — Nginx
#---------------------------------------------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./srcs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - vuejs-prod
      - django_backend

#---------------------------------------------------------------------------
#Django — backend
#---------------------------------------------------------------------------
  django_backend:
    build:
      context: ./srcs/backend
      dockerfile: Dockerfile
      target: development
    container_name: django_container
    image: django_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./srcs/backend:/app
    env_file:
      - .env
    networks:
      - frontend-net
      - backend-net
    depends_on:
        postgre_db:
          condition: service_healthy

#---------------------------------------------------------------------------
#PostgreSQL — Database (Relational Data & Text)
#---------------------------------------------------------------------------
  postgre_db:
    image: postgres:16
    container_name: postgre_db
    restart: unless-stopped
    environment:
      -  PGDATA=/var/lib/postgresql/data/pgdata
    ports:
    - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - /tmp/${USER}_ready2roll_pg_data:/var/lib/postgresql/data
      - ./srcs/postgre_db/init:/docker-entrypoint-initdb.d
    networks:
      - backend-net
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

#---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    environment:
        PGADMIN_DEFAULT_EMAIL: "admin@ready2roll.com"
        PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    depends_on:
      - postgre_db
    networks:
      - backend-net
    volumes:
      - ./srcs/postgre_db/servers.json:/pgadmin4/servers.json:ro

#MinIO — Object Storage (Event Posters & Media)
#---------------------------------------------------------------------------
  minio_storage:
    image: golang:alpine
    container_name: ready2roll-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /sgoinfre/${USER}/ready2roll/minio_data:/data
    env_file:
      - .env
    networks:
      - backend-net
      - frontend-net
    command: >
      /bin/sh -c "
      apk add --no-cache git gcc musl-dev > /dev/null;
      echo 'Building MinIO from source (this takes 1-2 minutes)...';
      go install github.com/minio/minio@latest > /dev/null 2>&1;
      /go/bin/minio server /data --console-address ':9001';
      "

  minio_setup:
    image: golang:alpine
    container_name: ready2roll-minio-setup
    depends_on:
      - minio_storage
    env_file:
      - .env
    networks:
      - backend-net
    command: >
      /bin/sh -c "
      apk add --no-cache git gcc musl-dev > /dev/null;
      echo 'Building MinIO Client from source...';
      go install github.com/minio/mc@latest > /dev/null 2>&1;
      until (/go/bin/mc alias set myminio http://ready2roll-storage:9000 $${MINIO_USER} $${MINIO_PASSWORD} > /dev/null 2>&1) do echo 'Waiting for MinIO...' && sleep 2; done;
      /go/bin/mc mb myminio/media || true;
      /go/bin/mc anonymous set public myminio/media;
      echo 'MinIO Bucket setup complete!';
      exit 0;
      "

#---------------------------------------------------------------------------
#Redis — In-Memory Datastore (WebSockets & Live Chat)
#---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: ready2roll-redis
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - /sgoinfre/${USER}/ready2roll/redis_data:/data
    networks:
      - backend-net

networks:
  frontend-net:
      driver: bridge
  backend-net:
      driver: bridge
