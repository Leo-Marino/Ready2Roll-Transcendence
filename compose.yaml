#=============================================================================
# Ready2Roll — compose.yaml (WAF + Vault hardened, school-machine variant)
#
# Traffic path:  browser -> waf (ModSecurity+CRS, TLS) -> nginx (internal
#                router) -> vuejs / django / minio (/media/)
#
# Networks (internal: true = no route to the outside, nothing published):
#   edge    : waf only. The ONLY network with published app ports.
#   app     : waf, nginx, vuejs, django, minio_storage, minio_setup
#   data    : django, postgre_db, redis_cache, pgadmin
#   secrets : vault, vault-agent   (no app container is on this network)
#   vaultdb : vault <-> postgre_db only (Database secrets engine, step 9)
#   mgmt    : pgadmin only, so its loopback port can publish (debug profile)
#
# Bootstrap secrets (gitignored; create with printf, NOT echo, so there is
# no trailing newline inside the password):
#   ./secrets/pg_root_password.txt   must equal POSTGRES_PASSWORD in Vault
#   ./secrets/redis_password.txt     must equal the password inside REDIS_URL
#   ./secrets/pgadmin_password.txt
#   ./secrets/approle/role_id
#   ./secrets/approle/secret_id
#=============================================================================

name: ready2roll

services:

#---------------------------------------------------------------------------
# WAF — ModSecurity v3 + OWASP CRS on nginx. Only public entrypoint.
#---------------------------------------------------------------------------
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: ready2roll-waf
    restart: unless-stopped
    ports:
      - "8443:8443"                             # HTTPS -> https://localhost:8443
    environment:
      BACKEND: http://nginx:80
      PORT: "8080"
      SSL_PORT: "8443"
      PROXY_SSL: "off"                          # backend is plain HTTP; "on" crashes the WAF
      SERVER_NAME: localhost
      MODSEC_RULE_ENGINE: ON
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_LOG_FORMAT: JSON
      CLIENT_MAX_BODY_SIZE: "600m"
      MODSEC_REQ_BODY_LIMIT: "629145600"         # poster uploads: set to your real max (bytes)
      PROXY_READ_TIMEOUT: "300"
    volumes:
      - ./srcs/waf/certs/server.crt:/etc/nginx/conf/server.crt:ro
      - ./srcs/waf/certs/server.key:/etc/nginx/conf/server.key:ro
      # Targeted, documented exclusions (chat, uploads, chatbot):
      - ./srcs/waf/rules/before-crs.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    networks:
      - edge
      - app
    depends_on:
      - nginx

#---------------------------------------------------------------------------
# Internal router: / -> vue, /api + /ws -> django, /media/ -> minio
#---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./srcs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app
    depends_on:
      - vuejs
      - django
      - minio_storage

#---------------------------------------------------------------------------
# Vue.js — frontend (still the dev build)
#---------------------------------------------------------------------------
  vuejs:
    build:
      context: ./srcs
      dockerfile: frontend/Dockerfile
      target: builder
    container_name: vuejs_container
    image: vue_frontend
    expose:
      - "5173"
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app

#---------------------------------------------------------------------------
# Vault — server mode, Raft storage, TLS. NOT dev mode.
#---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.18
    container_name: ready2roll-vault
    restart: unless-stopped
    command: ["server"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.crt
    volumes:
      - vault_data:/vault/file
      - ./srcs/vault/config:/vault/config:ro
      - ./srcs/vault/tls:/vault/tls:ro
      - vault_audit:/vault/logs
    networks:
      - secrets
      - vaultdb

#---------------------------------------------------------------------------
# Vault Agent — AppRole login, renders secrets to two separate tmpfs volumes
#---------------------------------------------------------------------------
  vault-agent:
    image: hashicorp/vault:1.18
    container_name: ready2roll-vault-agent
    restart: unless-stopped
    command: ["vault", "agent", "-config=/vault/agent/agent.hcl"]
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/ca.crt
    volumes:
      - ./srcs/vault/agent:/vault/agent:ro
      - ./srcs/vault/tls/ca.crt:/vault/tls/ca.crt:ro
      - ./secrets/approle:/vault/approle:ro
      - vault_secrets:/vault/secrets                  # django.env
      - vault_secrets_minio:/vault/secrets-minio      # minio.env
    networks:
      - secrets
    depends_on:
      - vault

#---------------------------------------------------------------------------
# Django — backend. No env_file, no published port, no route to Vault.
#---------------------------------------------------------------------------
  django:
    build:
      context: ./srcs/backend
      dockerfile: Dockerfile
      target: development
    container_name: django_container
    image: django
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,${PUBLIC_HOST_IP:-127.0.0.1},${PUBLIC_HOSTNAME:-localhost}"
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./srcs/backend:/app
      - vault_secrets:/vault/secrets:ro
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    networks:
      - app
      - data
      - egress
    depends_on:
      vault-agent:
        condition: service_started
      postgre_db:
        condition: service_healthy
      redis_cache:
        condition: service_started

#---------------------------------------------------------------------------
# PostgreSQL — data network only. Password from a file, not .env.
#---------------------------------------------------------------------------
  postgre_db:
    image: postgres:16
    container_name: postgre_db
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: r2r_admin
      POSTGRES_DB: ready2roll
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_root_password
    secrets:
      - pg_root_password
    volumes:
#      - /tmp/${USER}_ready2roll_pg_data:/var/lib/postgresql/data
#      - ./srcs/postgre_db/init:/docker-entrypoint-initdb.d:ro
      - ready2roll_pg_data:/var/lib/postgresql/data
      - ./srcs/postgre_db/init:/docker-entrypoint-initdb.d
    networks:
      - data
      - vaultdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

#---------------------------------------------------------------------------
# pgAdmin — debug only:  docker compose --profile debug up -d pgadmin
#---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["debug"]
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin2@ready2roll.com"
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    secrets:
      - pgadmin_password
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./srcs/postgre_db/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgre_db
    networks:
      - data
      - mgmt

#---------------------------------------------------------------------------
# MinIO — Event posters. Built ONCE into an image (see srcs/minio/Dockerfile)
# instead of compiling at every start, so it needs no internet at runtime.
# Reachable only from the app network (nginx proxies /media/ to it).
#---------------------------------------------------------------------------
  minio_storage:
    build:
      context: ./srcs/minio
    image: ready2roll_minio
    container_name: ready2roll-storage
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until [ -s /vault/secrets/minio.env ]; do
          i=$$((i+1))
          if [ "$$i" -gt 90 ]; then echo "FATAL: minio.env not rendered (is Vault sealed?)"; exit 1; fi
          sleep 1
        done
        . /vault/secrets/minio.env
        export MINIO_ROOT_USER="$$MINIO_USER" MINIO_ROOT_PASSWORD="$$MINIO_PASSWORD"
        exec minio server /data --console-address ":9001"
    volumes:
      - /sgoinfre/${USER}/ready2roll/minio_data:/data
      - vault_secrets_minio:/vault/secrets:ro
    networks:
      - app
    depends_on:
      - vault-agent

  minio_setup:
    build:
      context: ./srcs/minio
    image: ready2roll_minio
    container_name: ready2roll-minio-setup
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until [ -s /vault/secrets/minio.env ]; do
          i=$$((i+1)); [ "$$i" -gt 90 ] && { echo "FATAL: minio.env not rendered"; exit 1; }
          sleep 1
        done
        . /vault/secrets/minio.env
        until mc alias set myminio http://ready2roll-storage:9000 "$$MINIO_USER" "$$MINIO_PASSWORD" >/dev/null 2>&1; do
          echo "Waiting for MinIO..."; sleep 2
        done
        mc mb myminio/media || true
        mc anonymous set public myminio/media
        echo "MinIO bucket setup complete!"
    volumes:
      - vault_secrets_minio:/vault/secrets:ro
    networks:
      - app
    depends_on:
      - minio_storage

#---------------------------------------------------------------------------
# Redis — data network only, password required
#---------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: ready2roll-redis
    restart: unless-stopped
    command: >
      sh -c 'exec redis-server --appendonly yes
      --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - data

secrets:
  pg_root_password:
    file: ./secrets/pg_root_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt

volumes:
# minio_data:
  ready2roll_pg_data:
  redis_data:
  vault_data:
  vault_audit:
  vault_secrets:            # RAM-backed: Django secrets never touch disk
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=100,gid=1000,mode=0755"
  vault_secrets_minio:      # RAM-backed: MinIO sees only its own two values
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=100,gid=1000,mode=0755"

networks:
  edge:
    driver: bridge
  mgmt:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  secrets:
    driver: bridge
    internal: true
  vaultdb:
    driver: bridge
    internal: true
  egress:
    driver: bridge
