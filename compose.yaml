#=============================================================================

#Ready2Roll — docker-compose.yml

#Stack: Vue.js + Django + PostgreSQL + Nginx + MinIO + Redis

#=============================================================================

name: ready2roll

services:

#---------------------------------------------------------------------------

#Vue.js — frontend

#---------------------------------------------------------------------------

  vuejs-prod:
    build:
      context: ./srcs/frontend
      dockerfile: Dockerfile
    container_name: vuejs_container
    image: vue_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - frontend-net

#---------------------------------------------------------------------------

#Reverse proxy — Nginx

#---------------------------------------------------------------------------

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./srcs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
    depends_on:
      - vuejs-prod
      - django_backend

#---------------------------------------------------------------------------

#Django — backend

#---------------------------------------------------------------------------

  django_backend:
    build:
      context: ./srcs/backend
      dockerfile: Dockerfile
      target: development
    container_name: django_container
    image: django_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./srcs/backend:/app
    env_file:
      - .env
    networks:
      - frontend-net
      - backend-net
    depends_on:
        postgre_db:
          condition: service_healthy

#---------------------------------------------------------------------------

#PostgreSQL — Database (Relational Data & Text)

#---------------------------------------------------------------------------

  postgre_db:
    image: postgres:16
    container_name: postgre_db
    restart: unless-stopped
    environment:
      -  PGDATA=/var/lib/postgresql/data/pgdata
    ports:
    - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./srcs/postgre_db/init:/docker-entrypoint-initdb.d
    networks:
      - backend-net
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

#---------------------------------------------------------------------------

#MinIO — Object Storage (Event Posters & Media)

#---------------------------------------------------------------------------

  # minio_storage:
  #   image: minio/minio
  #   container_name: ready2roll-storage
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   env_file:
  #     - .env
  #   networks:
  #     - backend-net
  #     - frontend-net

#---------------------------------------------------------------------------

#Redis — In-Memory Datastore (WebSockets & Live Chat)

#---------------------------------------------------------------------------

  redis_cache:
    image: redis:7-alpine
    container_name: ready2roll-redis
    restart: unless-stopped
# --appendonly yes tells Redis to save a persistent log to the hard drive
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net

volumes:
  pg_data:
  minio_data:
  redis_data: # Volume added so chat history survives container restarts

networks:
  frontend-net:
      driver: bridge
  backend-net:
      driver: bridge
